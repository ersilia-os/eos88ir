Title: Chemical Dice Molecular Embeddings
Description: Embeds a molecule as an 8192-dimensional vector from its SMILES 
  alone. The authors fused six views of each molecule (descriptors, graph, 
  image, bioactivity, quantum and language features) into a teacher embedding 
  and trained a Mamba state-space model on about 2.2 million ChEMBL compounds to
  predict it. A classifier built on the embedding prioritised two compounds that
  reduced hydroxyurea-induced DNA damage in yeast. Ersilia canonicalises SMILES 
  first; inputs beyond 126 tokens are truncated.
